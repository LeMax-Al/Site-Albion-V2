name: Cache all Albion catalogue icons

on:
  workflow_dispatch:
  push:
    paths:
      - "builds.html"
      - ".github/workflows/cache-albion-items.yml"

permissions:
  contents: write

jobs:
  cache-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download every tier, enchantment and quality
        shell: bash
        run: |
          mkdir -p assets/items
          ids=(
            2H_CLAYMORE MAIN_SWORD MAIN_DAGGER 2H_FIRESTAFF MAIN_HOLYSTAFF
            2H_BOW 2H_HAMMER MAIN_CURSEDSTAFF HEAD_CLOTH_SET2 HEAD_CLOTH_SET1
            HEAD_PLATE_SET1 CAPEITEM_MORGANA CAPEITEM_MARTLOCK ARMOR_CLOTH_SET2
            ARMOR_CLOTH_SET1 ARMOR_PLATE_SET1 BAG OFF_BOOK OFF_TORCH
            SHOES_CLOTH_SET1 SHOES_CLOTH_SET2 SHOES_PLATE_SET1 MEAL_STEW
            MEAL_OMELETTE MEAL_PIE POTION_REVIVE POTION_HEAL POTION_COOLDOWN
            MOUNT_HORSE MOUNT_OX MOUNT_DIREWOLF MOUNT_DIREBEAR
          )
          : > /tmp/icon-jobs.txt
          for id in "${ids[@]}"; do
            for tier in 4 5 6 7 8; do
              for enchant in 0 1 2 3 4; do
                for quality in 1 2 3 4 5; do
                  suffix=""
                  if [ "$enchant" -gt 0 ]; then suffix="@${enchant}"; fi
                  item="T${tier}_${id}${suffix}"
                  file="assets/items/${id}_T${tier}_E${enchant}_Q${quality}.png"
                  url="https://render.albiononline.com/v1/item/${item}.png?quality=${quality}&size=160&locale=en"
                  printf '%s\t%s\n' "$url" "$file" >> /tmp/icon-jobs.txt
                done
              done
            done
          done
          export -f
          cat /tmp/icon-jobs.txt | xargs -P 12 -n 2 bash -c '
            url="$0"; file="$1"
            if [ ! -s "$file" ]; then
              curl --silent --show-error --fail --location --retry 3 --retry-delay 1 "$url" -o "$file" || exit 1
            fi
          '
      - name: Verify downloaded images
        run: |
          count=$(find assets/items -type f -name "*.png" | wc -l)
          echo "Images available: $count"
          test "$count" -ge 4000
      - name: Commit cached icons
        run: |
          if [ -n "$(git status --porcelain assets/items)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/items
            git commit -m "Cache all Albion catalogue item icon variants"
            git push
          else
            echo "All catalogue images are already cached."
          fi
