name: Cache complete Albion build catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  push:
    paths:
      - "builds.html"
      - ".github/workflows/cache-albion-items.yml"

permissions:
  contents: write

concurrency:
  group: cache-albion-build-catalogue
  cancel-in-progress: false

jobs:
  cache-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download every build-slot item and cache one icon per item family
        env:
          ALBION_WORKER: https://site-albion-v2.maxbruneteau.workers.dev
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const slots = {
            mainhand:'Arme', offhand:'Main secondaire', head:'Tête', armor:'Torse',
            shoes:'Pieds', cape:'Cape', bag:'Sac', mount:'Monture', food:'Nourriture', potion:'Potion'
          };
          const root='assets/items', dataDir='assets/data';
          await fs.mkdir(root,{recursive:true}); await fs.mkdir(dataDir,{recursive:true});
          const all=new Map();
          const dumpUrl='https://raw.githubusercontent.com/broderickhyman/ao-bin-dumps/master/items.json';
          const dumpResponse=await fetch(dumpUrl,{signal:AbortSignal.timeout(120000)});
          if(!dumpResponse.ok)throw new Error('Téléchargement du catalogue source impossible: HTTP '+dumpResponse.status);
          const dump=await dumpResponse.json();
          const groups=dump.items||dump;
          const records=Object.values(groups).flatMap(v=>Array.isArray(v)?v:[]);
          if(records.length<1000)throw new Error('Dump source incomplet ou format inattendu ('+records.length+' entrées)');
          const classify=id=>{
            const base=id.replace(/^T[2-8]_/, '').replace(/@[0-4]$/, '');
            if(/^(MAIN_|2H_)/.test(base))return 'Arme';
            if(/^OFF_/.test(base))return 'Main secondaire';
            if(/^HEAD_/.test(base))return 'Tête';
            if(/^ARMOR_/.test(base))return 'Torse';
            if(/^SHOES_/.test(base))return 'Pieds';
            if(/^(CAPE|CAPEITEM_)/.test(base))return 'Cape';
            if(/^BAG(?:_|$)/.test(base))return 'Sac';
            if(/^MOUNT_/.test(base))return 'Monture';
            if(/^MEAL_/.test(base))return 'Nourriture';
            if(/^POTION_/.test(base))return 'Potion';
            return null;
          };
          for(const x of records){
            const id=String(x['@uniquename']||x.UniqueName||'').replace(/\.png$/i,'');
            const m=id.match(/^T([2-8])_(.+)$/);if(!m)continue;
            const category=classify(id);if(!category)continue;
            const tier=Number(m[1]),baseId=m[2].replace(/@[0-4]$/,'');
            const key=category+'|'+baseId;
            if(!all.has(key))all.set(key,{id,baseId,renderId:baseId,name:baseId.replace(/_/g,' '),category,availableTiers:[],sourceIds:[],maxQuality:5});
            const item=all.get(key);
            if(!item.sourceIds.includes(id))item.sourceIds.push(id);
            if(!item.availableTiers.includes(tier))item.availableTiers.push(tier);
            if(tier<Number(item.id.match(/^T([2-8])_/)[1]))item.id=id;
          }
          const items=[...all.values()].map(x=>({...x,availableTiers:x.availableTiers.sort((a,b)=>a-b),sourceIds:x.sourceIds.sort((a,b)=>Number(a.match(/^T([2-8])_/)[1])-Number(b.match(/^T([2-8])_/)[1]))})).sort((a,b)=>a.category.localeCompare(b.category)||a.name.localeCompare(b.name));
          if(items.length<100)throw new Error('Catalogue d’équipement anormalement petit ('+items.length+'). Refus de publier une sauvegarde partielle.');
          console.log('Dump source:',records.length,'entrées | objets build:',items.length);
          const missing=[];
          let cursor=0,ok=0;
          async function worker(){
            while(true){
              const item=items[cursor++];if(!item)return;
              const filename=path.join(root,item.renderId+'.png');
              try{
                let bytes;
                try{bytes=await fs.readFile(filename);if(bytes.length<100||bytes[0]!==0x89||bytes[1]!==0x50)bytes=null}catch{}
                if(!bytes){
                  const candidates=[...new Set((item.sourceIds||[item.id]).map(id=>id.replace(/@[0-4]$/,'')))];
                  const variants=[
                    id=>'https://render.albiononline.com/v1/item/'+encodeURIComponent(id)+'.png?quality=1&size=160',
                    id=>'https://render.albiononline.com/v1/item/'+encodeURIComponent(id)+'.png?size=160',
                    id=>'https://render.albiononline.com/v1/item/'+encodeURIComponent(id)+'.png'
                  ];
                  let last;
                  outer: for(const id of candidates){
                    for(const makeUrl of variants){
                      for(let n=0;n<3;n++){
                        try{
                          const response=await fetch(makeUrl(id),{signal:AbortSignal.timeout(25000),headers:{'user-agent':'Site-Albion-V2 item cache'}});
                          if(!response.ok)throw new Error('HTTP '+response.status);
                          const candidate=Buffer.from(await response.arrayBuffer());
                          if(candidate.length<100||candidate[0]!==0x89||candidate[1]!==0x50)throw new Error('PNG invalide');
                          bytes=candidate;break outer;
                        }catch(e){last=e;await new Promise(r=>setTimeout(r,700*(n+1)))}
                      }
                    }
                  }
                  if(!bytes)throw last||new Error('Aucun rendu disponible');
                  await fs.writeFile(filename,bytes);
                }
                item.iconFallback=false;
                ok++;
                if(ok%25===0)console.log('Progression icônes:',ok+'/'+items.length);
              }catch(e){
                item.iconFallback=false;
                missing.push({id:item.id,sourceIds:item.sourceIds,error:String(e.message||e)});
                console.log('Image ignorée (emplacement laissé vide):',item.id,'—',String(e.message||e));
              }
            }
          }
          await Promise.all(Array.from({length:4},worker));
          for(const name of await fs.readdir(root))if(name.endsWith('.svg'))await fs.rm(path.join(root,name),{force:true});
          await fs.writeFile(path.join(dataDir,'build-items-catalog.json'),JSON.stringify({generatedAt:new Date().toISOString(),source:'ao-bin-dumps (données statiques Albion)',count:items.length,items},null,2)+'\n');
          await fs.writeFile(path.join(dataDir,'build-items-missing.json'),JSON.stringify(missing,null,2)+'\n');
          console.log('Familles catalogue:',items.length,'| images Albion chargées:',ok,'| images absentes laissées vides:',missing.length);
          NODE
      - name: Validate catalogue and image integrity
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const c=JSON.parse(await fs.readFile('assets/data/build-items-catalog.json','utf8'));
          if(!Array.isArray(c.items)||c.count!==c.items.length||c.count<100)throw new Error('Catalogue incomplet');
          const seen=new Set();
          for(const item of c.items){
            if(!item.baseId||!item.category||!Array.isArray(item.availableTiers)||!item.availableTiers.length)throw new Error('Entrée invalide: '+JSON.stringify(item));
            if(seen.has(item.category+'|'+item.baseId))throw new Error('Doublon: '+item.baseId);
            seen.add(item.category+'|'+item.baseId);
            try {
              const b=await fs.readFile('assets/items/'+item.renderId+'.png');
              if(b.length<100||b[0]!==0x89||b[1]!==0x50)throw new Error('PNG invalide');
            } catch(e) {
              if(e.code!=='ENOENT')throw new Error('Image invalide: '+item.renderId+' ('+e.message+')');
              console.log('Image absente, affichage vide autorisé:',item.renderId);
            }
          }
          console.log('VALIDATION OK:',c.count,'familles; images absentes autorisées et laissées vides.');
          NODE
      - name: Commit complete catalogue and icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/items assets/data/build-items-catalog.json assets/data/build-items-missing.json
          if git diff --cached --quiet; then echo "Catalogue déjà à jour"; else git commit -m "Cache complete Albion build item catalogue"; git push; fi
