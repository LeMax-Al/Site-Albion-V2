name: Cache complete Albion build catalogue

on:
  # Les téléchargements du catalogue ne se lancent plus automatiquement.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cache-albion-build-catalogue-sharded
  cancel-in-progress: false

jobs:
  cache-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          # Les runs en attente peuvent démarrer après une publication précédente.
          # Partir de main évite de rejouer un ancien SHA et de créer un conflit de rebase.
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download every build-slot item and cache one icon per item family
        env:
          ALBION_WORKER: https://site-albion-v2.maxbruneteau.workers.dev
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const slots = {
            mainhand:'Arme', offhand:'Main secondaire', head:'Tête', armor:'Torse',
            shoes:'Pieds', cape:'Cape', bag:'Sac', mount:'Monture', food:'Nourriture', potion:'Potion'
          };
          const root='assets/items', dataDir='assets/data';
          await fs.mkdir(root,{recursive:true}); await fs.mkdir(dataDir,{recursive:true});
          const all=new Map();
          const dumpUrl='https://raw.githubusercontent.com/broderickhyman/ao-bin-dumps/master/items.json';
          const dumpResponse=await fetch(dumpUrl,{signal:AbortSignal.timeout(120000)});
          if(!dumpResponse.ok)throw new Error('Téléchargement du catalogue source impossible: HTTP '+dumpResponse.status);
          const dump=await dumpResponse.json();
          const groups=dump.items||dump;
          const records=Object.values(groups).flatMap(v=>Array.isArray(v)?v:[]);
          if(records.length<1000)throw new Error('Dump source incomplet ou format inattendu ('+records.length+' entrées)');
          const classify=id=>{
            const base=id.replace(/^T[2-8]_/, '').replace(/@[0-4]$/, '');
            if(/^(MAIN_|2H_)/.test(base))return 'Arme';
            if(/^OFF_/.test(base))return 'Main secondaire';
            if(/^HEAD_/.test(base))return 'Tête';
            if(/^ARMOR_/.test(base))return 'Torse';
            if(/^SHOES_/.test(base))return 'Pieds';
            if(/^(CAPE|CAPEITEM_)/.test(base))return 'Cape';
            if(/^BAG(?:_|$)/.test(base))return 'Sac';
            if(/^MOUNT_/.test(base))return 'Monture';
            if(/^MEAL_/.test(base))return 'Nourriture';
            if(/^POTION_/.test(base))return 'Potion';
            return null;
          };
          for(const x of records){
            const id=String(x['@uniquename']||x.UniqueName||'').replace(/\.png$/i,'');
            const m=id.match(/^T([2-8])_(.+)$/);if(!m)continue;
            const category=classify(id);if(!category)continue;
            // Éléments décoratifs et armoiries exclus du catalogue de builds.
            if(/(?:^|_)(?:CREST|CRESTS|HERALDIC)(?:_|$)/i.test(id))continue;
            if(/^CAPE.*(?:KEEPER|MORGANA|UNDEAD).*(?:DECORATIVE|DECORATION)/i.test(id))continue;
            if(/^CAPE.*(?:DECORATIVE|DECORATION).*(?:KEEPER|MORGANA|UNDEAD)/i.test(id))continue;
            if(/ARENA.*(?:BANNER|PENNANT)|(?:BANNER|PENNANT).*ARENA/i.test(id))continue;
            const tier=Number(m[1]),baseId=m[2].replace(/@[0-4]$/,'');
            const key=category+'|'+baseId;
            if(!all.has(key))all.set(key,{id,baseId,renderId:baseId,name:baseId.replace(/_/g,' '),category,availableTiers:[],sourceIds:[],maxQuality:5});
            const item=all.get(key);
            if(!item.sourceIds.includes(id))item.sourceIds.push(id);
            if(!item.availableTiers.includes(tier))item.availableTiers.push(tier);
            if(tier<Number(item.id.match(/^T([2-8])_/)[1]))item.id=id;
          }
          // Certaines potions équipables récentes/spéciales ne remontent pas toujours
          // dans le dump principal. Les ajouter explicitement pour garantir leur présence.
          const requiredPotions=[
            {baseId:'POTION_MOB_RESET',tiers:[3,5,7]},
            {baseId:'POTION_TORNADO',tiers:[4,6,8]}
          ];
          for(const potion of requiredPotions){
            const key='Potion|'+potion.baseId;
            if(!all.has(key)){
              const id='T'+potion.tiers[0]+'_'+potion.baseId;
              all.set(key,{id,baseId:potion.baseId,renderId:potion.baseId,name:potion.baseId==='POTION_MOB_RESET'?'Potion de calme':'Tornade en bouteille',category:'Potion',availableTiers:[...potion.tiers],sourceIds:potion.tiers.map(t=>'T'+t+'_'+potion.baseId),maxQuality:5});
            }
          }
          // Cape de Contrebandier : équipement de cape ajouté avec Rogue Frontier.
          // Le dump principal peut ne pas encore l'inclure selon sa version.
          const requiredCapes=[
            {baseId:'CAPEITEM_SMUGGLER',tiers:[4,5,6,7,8],name:'Cape du contrebandier'}
          ];
          for(const cape of requiredCapes){
            const key='Cape|'+cape.baseId;
            if(!all.has(key)){
              const id='T'+cape.tiers[0]+'_'+cape.baseId;
              all.set(key,{id,baseId:cape.baseId,renderId:cape.baseId,name:cape.name,category:'Cape',availableTiers:[...cape.tiers],sourceIds:cape.tiers.map(t=>'T'+t+'_'+cape.baseId),maxQuality:5});
            }
          }
          const items=[...all.values()].map(x=>({...x,availableTiers:x.availableTiers.sort((a,b)=>a-b),sourceIds:x.sourceIds.sort((a,b)=>Number(a.match(/^T([2-8])_/)[1])-Number(b.match(/^T([2-8])_/)[1]))})).sort((a,b)=>a.category.localeCompare(b.category)||a.name.localeCompare(b.name));
          if(items.length<100)throw new Error('Catalogue d’équipement anormalement petit ('+items.length+'). Refus de publier une sauvegarde partielle.');
          console.log('Dump source:',records.length,'entrées | objets build:',items.length);
          const missing=[];
          // Les PNG valides déjà présents dans le dépôt sont réutilisés.
          // Une image absente/indisponible n'est retentée qu'après 7 jours.
          let previousMissing=[];
          try{previousMissing=JSON.parse(await fs.readFile(path.join(dataDir,'build-items-missing.json'),'utf8'));if(!Array.isArray(previousMissing))previousMissing=[];}catch{}
          const previousMissingById=new Map(previousMissing.map(x=>[x.id,x]));
          const itemById=new Map(items.map(x=>[x.id,x]));
          let cursor=0,ok=0;
          async function worker(){
            while(true){
              const item=items[cursor++];if(!item)return;
              const filename=path.join(root,item.renderId+'.png');
              try{
                let bytes;
                try{bytes=await fs.readFile(filename);if(bytes.length<100||bytes[0]!==0x89||bytes[1]!==0x50)bytes=null}catch{}
                if(!bytes){
                  // Toujours retenter les images manquantes à chaque exécution.
                  // Chaque URL/candidat dispose de 5 tentatives avant le suivant.
                  const candidates=[...new Set((item.sourceIds||[item.id]).map(id=>id.replace(/@[0-4]$/,'')))];
                  const variants=[
                    id=>'https://render.albiononline.com/v1/item/'+encodeURIComponent(id)+'.png?quality=1&size=160',
                    id=>'https://render.albiononline.com/v1/item/'+encodeURIComponent(id)+'.png?size=160',
                    id=>'https://render.albiononline.com/v1/item/'+encodeURIComponent(id)+'.png'
                  ];
                  let last;
                  outer: for(const id of candidates){
                    for(const makeUrl of variants){
                      for(let n=0;n<5;n++){
                        try{
                          const response=await fetch(makeUrl(id),{signal:AbortSignal.timeout(25000),headers:{'user-agent':'Site-Albion-V2 item cache'}});
                          if(!response.ok)throw new Error('HTTP '+response.status);
                          const candidate=Buffer.from(await response.arrayBuffer());
                          if(candidate.length<100||candidate[0]!==0x89||candidate[1]!==0x50)throw new Error('PNG invalide');
                          bytes=candidate;break outer;
                        }catch(e){last=e;if(n<4)await new Promise(r=>setTimeout(r,1000*(n+1)))}
                      }
                    }
                  }
                  if(!bytes)throw last||new Error('Aucun rendu disponible');
                  await fs.writeFile(filename,bytes);
                }
                item.iconFallback=false;
                ok++;
                if(ok%25===0)console.log('Progression icônes:',ok+'/'+items.length);
              }catch(e){
                item.iconFallback=false;
                missing.push({id:item.id,sourceIds:item.sourceIds,name:item.name,category:item.category,baseId:item.baseId,error:String(e.message||e),lastAttemptAt:new Date().toISOString()});
                console.log('Image ignorée (emplacement laissé vide):',item.id,'—',String(e.message||e));
              }
            }
          }
          await Promise.all(Array.from({length:4},worker));
          for(const name of await fs.readdir(root))if(name.endsWith('.svg'))await fs.rm(path.join(root,name),{force:true});
          await fs.writeFile(path.join(dataDir,'build-items-catalog.json'),JSON.stringify({generatedAt:new Date().toISOString(),source:'ao-bin-dumps (données statiques Albion)',count:items.length,items},null,2)+'\n');
          await fs.writeFile(path.join(dataDir,'build-items-missing.json'),JSON.stringify(missing,null,2)+'\n');
          console.log('Familles catalogue:',items.length,'| images Albion chargées:',ok,'| images absentes laissées vides:',missing.length);
          NODE
      - name: Validate catalogue and image integrity
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const c=JSON.parse(await fs.readFile('assets/data/build-items-catalog.json','utf8'));
          if(!Array.isArray(c.items)||c.count!==c.items.length||c.count<100)throw new Error('Catalogue incomplet');
          const seen=new Set();
          for(const item of c.items){
            if(!item.baseId||!item.category||!Array.isArray(item.availableTiers)||!item.availableTiers.length)throw new Error('Entrée invalide: '+JSON.stringify(item));
            if(seen.has(item.category+'|'+item.baseId))throw new Error('Doublon: '+item.baseId);
            seen.add(item.category+'|'+item.baseId);
            try {
              const b=await fs.readFile('assets/items/'+item.renderId+'.png');
              if(b.length<100||b[0]!==0x89||b[1]!==0x50)throw new Error('PNG invalide');
            } catch(e) {
              if(e.code!=='ENOENT')throw new Error('Image invalide: '+item.renderId+' ('+e.message+')');
              console.log('Image absente, affichage vide autorisé:',item.renderId);
            }
          }
          console.log('VALIDATION OK:',c.count,'familles; images absentes autorisées et laissées vides.');
          NODE
      - name: Commit complete catalogue and icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/items assets/data/build-items-catalog.json assets/data/build-items-missing.json
          if git diff --cached --quiet; then
            echo "Catalogue déjà à jour"
            exit 0
          fi

          git commit -m "Cache complete Albion build item catalogue"

          # Le dépôt peut recevoir d'autres commits pendant la génération
          # (édition du site, Pages ou autre automatisation). Rebaser le
          # catalogue sur la dernière version de main avant chaque push.
          for attempt in 1 2 3 4 5; do
            echo "Publication du catalogue : tentative $attempt/5"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Rebase impossible : conflit avec des modifications distantes."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Catalogue publié avec succès."
              exit 0
            fi
            echo "La branche main a encore avancé ; nouvelle tentative dans 3 secondes."
            sleep 3
          done

          echo "::error::Impossible de publier le catalogue après 5 tentatives."
          exit 1

  cache-variant-images:
    needs: cache-catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        lot: [1, 2, 3, 4]
    name: Images variantes — lot ${{ matrix.lot }}/4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Télécharger les variantes du lot
        env:
          LOT: ${{ matrix.lot }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const lot=Number(process.env.LOT), total=4;
          if(!Number.isInteger(lot)||lot<1||lot>total)throw new Error('Lot invalide');
          const catalog=JSON.parse(await fs.readFile('assets/data/build-items-catalog.json','utf8'));
          if(!Array.isArray(catalog.items)||catalog.items.length<100)throw new Error('Catalogue absent ou incomplet');
          const root='assets/items/variants', dataDir='assets/data';
          await fs.mkdir(root,{recursive:true});
          const index={generatedAt:new Date().toISOString(),source:'Albion Render API',lot,total,format:'T{tier}_{baseId}[@{enchant}]_q{quality}.png',items:{}};
          const missingPath=path.join(dataDir,'build-items-variants-missing-'+lot+'.json');
          let oldMissing=[];
          try{oldMissing=JSON.parse(await fs.readFile(missingPath,'utf8'));if(!Array.isArray(oldMissing))oldMissing=[];}catch{}
          const oldByKey=new Map(oldMissing.map(x=>[x.key,x]));
          const jobs=[];
          for(const item of catalog.items){
            for(const tier of item.availableTiers||[]){
              const hasEnchant=/^(MAIN_|2H_|OFF_|HEAD_|ARMOR_|SHOES_)/.test(item.baseId);
              for(let enchant=0;enchant<=(hasEnchant?3:0);enchant++){
                for(let quality=1;quality<=5;quality++){
                  const key=[tier,item.baseId,enchant,quality].join('|');
                  // Répartition stable : une variante appartient toujours au même lot.
                  let hash=0;for(const ch of key)hash=(hash*31+ch.charCodeAt(0))>>>0;
                  if(hash%total!==lot-1)continue;
                  const id='T'+tier+'_'+item.baseId+(enchant?'@'+enchant:'');
                  jobs.push({key,id,tier,baseId:item.baseId,name:item.name,category:item.category,enchant,quality,filename:id+'_q'+quality+'.png'});
                }
              }
            }
          }
          console.log('Lot',lot+'/'+total,'— variantes attribuées:',jobs.length);
          let cursor=0,ok=0,already=0;const missing=[];
          async function worker(){
            while(true){
              const job=jobs[cursor++];if(!job)return;
              const file=path.join(root,job.filename);
              try{
                let bytes;
                try{bytes=await fs.readFile(file);if(bytes.length<100||bytes[0]!==0x89||bytes[1]!==0x50)bytes=null;}catch{}
                if(bytes){index.items[job.key]='assets/items/variants/'+job.filename;already++;continue;}
                // Toujours retenter chaque variante manquante ; ne pas appliquer de délai de 7 jours.
                const urls=[
                  'https://render.albiononline.com/v1/item/'+encodeURIComponent(job.id)+'.png?quality='+job.quality+'&size=160',
                  'https://render.albiononline.com/v1/item/'+encodeURIComponent(job.id)+'.png?quality='+job.quality,
                  'https://render.albiononline.com/v1/item/'+encodeURIComponent(job.id)+'.png'
                ];
                let lastError;
                for(const url of urls){
                  for(let attempt=0;attempt<5;attempt++){
                    try{
                      const response=await fetch(url,{signal:AbortSignal.timeout(20000),headers:{'user-agent':'Site-Albion-V2 variant cache'}});
                      if(!response.ok)throw new Error('HTTP '+response.status);
                      const candidate=Buffer.from(await response.arrayBuffer());
                      if(candidate.length<100||candidate[0]!==0x89||candidate[1]!==0x50)throw new Error('PNG invalide');
                      bytes=candidate;break;
                    }catch(e){lastError=e;if(attempt<4)await new Promise(r=>setTimeout(r,1000*(attempt+1)));}
                  }
                  if(bytes)break;
                }
                if(!bytes)throw lastError||new Error('Rendu indisponible');
                await fs.writeFile(file,bytes);
                index.items[job.key]='assets/items/variants/'+job.filename;ok++;
              }catch(e){
                missing.push({key:job.key,id:job.id,name:job.name,category:job.category,baseId:job.baseId,tier:job.tier,enchant:job.enchant,quality:job.quality,error:String(e.message||e),lastAttemptAt:new Date().toISOString()});
              }
              if(cursor%100===0)console.log('Progression lot',lot+':',cursor+'/'+jobs.length,'PNG:',ok,'déjà présents:',already,'manquants:',missing.length);
            }
          }
          await Promise.all(Array.from({length:6},worker));
          await fs.writeFile(path.join(dataDir,'build-items-variants-'+lot+'.json'),JSON.stringify(index,null,2)+'\n');
          await fs.writeFile(missingPath,JSON.stringify(missing,null,2)+'\n');
          console.log('Lot',lot,'terminé — nouveaux PNG:',ok,'déjà présents:',already,'indisponibles:',missing.length);
          NODE
      - name: Publier les images et l’index du lot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/items/variants assets/data/build-items-variants-${{ matrix.lot }}.json assets/data/build-items-variants-missing-${{ matrix.lot }}.json
          if git diff --cached --quiet; then
            echo "Lot déjà à jour"
            exit 0
          fi
          git commit -m "Cache Albion item image variants — lot ${{ matrix.lot }}/4"
          for attempt in 1 2 3 4 5; do
            echo "Publication du lot : tentative $attempt/5"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::warning::Rebase du lot impossible : conflit avec des modifications distantes."
              git rebase --abort || true
              sleep 3
              continue
            fi
            if git push origin HEAD:main; then
              echo "Lot ${{ matrix.lot }} publié."
              exit 0
            fi
            echo "La branche main a avancé pendant le push ; nouvelle tentative."
            sleep 3
          done
          echo "::error::Publication du lot impossible après 5 tentatives."
          exit 1
