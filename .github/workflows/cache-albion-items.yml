name: Cache Albion item icons

on:
  workflow_dispatch:
  push:
    paths:
      - "builds.html"
      - ".github/workflows/cache-albion-items.yml"

permissions:
  contents: write

jobs:
  cache-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download catalogue icons from Albion render API
        shell: bash
        run: |
          mkdir -p assets/items
          ids=(
            2H_CLAYMORE MAIN_SWORD MAIN_DAGGER 2H_FIRESTAFF MAIN_HOLYSTAFF
            2H_BOW 2H_HAMMER MAIN_CURSEDSTAFF HEAD_CLOTH_SET2 HEAD_CLOTH_SET1
            HEAD_PLATE_SET1 CAPEITEM_MORGANA CAPEITEM_MARTLOCK ARMOR_CLOTH_SET2
            ARMOR_CLOTH_SET1 ARMOR_PLATE_SET1 BAG OFF_BOOK OFF_TORCH
            SHOES_CLOTH_SET1 SHOES_CLOTH_SET2 SHOES_PLATE_SET1 MEAL_STEW
            MEAL_OMELETTE MEAL_PIE POTION_REVIVE POTION_HEAL POTION_COOLDOWN
            MOUNT_HORSE MOUNT_OX MOUNT_DIREWOLF MOUNT_DIREBEAR
          )
          for id in "${ids[@]}"; do
            file="assets/items/${id}.png"
            if [ ! -s "$file" ]; then
              curl --fail --location --retry 3 --retry-delay 2 \
                "https://render.albiononline.com/v1/item/T4_${id}.png?quality=1&size=160&locale=en" \
                --output "$file"
            fi
          done
      - name: Commit cached icons
        run: |
          if [ -n "$(git status --porcelain assets/items)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/items
            git commit -m "Cache Albion equipment icons"
            git push
          else
            echo "All catalogue icons are already cached."
          fi
