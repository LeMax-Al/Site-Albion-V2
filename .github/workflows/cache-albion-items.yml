name: Cache Albion build item icons

on:
  workflow_dispatch:
  push:
    paths:
      - "builds.html"
      - ".github/workflows/cache-albion-items.yml"

permissions:
  contents: write

concurrency:
  group: cache-albion-items
  cancel-in-progress: true

jobs:
  cache-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download catalogue icons (parallel, available variants only)
        shell: bash
        run: |
          set -u
          mkdir -p assets/items
          ids=(
            2H_CLAYMORE MAIN_SWORD MAIN_DAGGER 2H_FIRESTAFF MAIN_HOLYSTAFF
            2H_BOW 2H_HAMMER MAIN_CURSEDSTAFF HEAD_CLOTH_SET2 HEAD_CLOTH_SET1
            HEAD_PLATE_SET1 CAPEITEM_MORGANA CAPEITEM_MARTLOCK ARMOR_CLOTH_SET2
            ARMOR_CLOTH_SET1 ARMOR_PLATE_SET1 BAG OFF_BOOK OFF_TORCH
            SHOES_CLOTH_SET1 SHOES_CLOTH_SET2 SHOES_PLATE_SET1 MEAL_STEW
            MEAL_OMELETTE MEAL_PIE POTION_REVIVE POTION_HEAL POTION_COOLDOWN
            MOUNT_HORSE MOUNT_OX MOUNT_DIREWOLF MOUNT_DIREBEAR
          )
          : > /tmp/icon-jobs.txt
          for id in "${ids[@]}"; do
            for tier in 4 5 6 7 8; do
              for enchant in 0 1 2 3; do
                suffix=""
                if [ "$enchant" -gt 0 ]; then suffix="@${enchant}"; fi
                item="T${tier}_${id}${suffix}"
                file="assets/items/${id}_T${tier}_E${enchant}_Q1.png"
                if [ ! -s "$file" ]; then
                  url="https://render.albiononline.com/v1/item/${item}.png?quality=1&size=160&locale=en"
                  printf '%s\t%s\n' "$url" "$file" >> /tmp/icon-jobs.txt
                fi
              done
            done
          done
          export -f
          cat /tmp/icon-jobs.txt | xargs -r -P 16 -n 2 bash -c '
            url="$0"; file="$1"
            if ! curl --silent --show-error --fail --location --connect-timeout 5 --max-time 12 --retry 1 --retry-delay 1 "$url" -o "$file"; then
              rm -f "$file"
              exit 0
            fi
          '
          echo "Download attempts completed: $(wc -l < /tmp/icon-jobs.txt)"
          echo "Images cached: $(find assets/items -type f -name "*.png" | wc -l)"
      - name: Commit cached icons
        run: |
          if [ -n "$(git status --porcelain assets/items)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/items
            git commit -m "Cache Albion build item icons"
            git push
          else
            echo "No new item icons to commit."
          fi
